<div class="instructor-dashboard">
  <h1>Instructor Command Center</h1>
  <p>Pending: {{ store.pendingCount() }}</p>

  @defer (on viewport; prefetch on idle) {
  <tms-analytics-chart></tms-analytics-chart>
  } @placeholder {
  <div class="instructor-dashboard__placeholder">Scroll down to view analytics...</div>
  } @loading (minimum 500ms) {
  <div class="instructor-dashboard__placeholder">Downloading chart engine...</div>
  } @error {
  <div class="instructor-dashboard__error">Failed to load chart. Check your connection.</div>
  }
</div>
