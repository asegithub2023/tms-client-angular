<div class="transcript-request">
  <button type="button" (click)="request()" [disabled]="isRequesting()">
    {{ isRequesting() ? 'Requesting...' : 'Request Transcript' }}
  </button>

  @if (status(); as s) {
    <p class="transcript-status">
      Status: <strong>{{ stateLabel(s.state) }}</strong> (Report {{ s.reportId }})
    </p>

    @if (s.state === READY) {
      <button type="button" (click)="download(s.reportId)" [disabled]="isDownloading()">
        {{ isDownloading() ? 'Downloading...' : 'Download Transcript' }}
      </button>
    }

    @if (s.state === FAILED && s.errorMessage) {
      <p class="error">{{ s.errorMessage }}</p>
    }
  }

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }
</div>
