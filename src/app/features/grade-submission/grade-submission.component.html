<div class="max-w-md mx-auto my-8">
  <mat-card class="shadow-xl rounded-2xl bg-slate-900 border border-slate-800 text-slate-100 p-6">
    <mat-card-header class="mb-4">
      <mat-card-title class="text-xl font-bold text-slate-100">
        Grade Submission Form
      </mat-card-title>
      <mat-card-subtitle class="text-slate-400 text-sm">
        Instructor Midterm Grading
      </mat-card-subtitle>
    </mat-card-header>

    <form [formGroup]="gradeForm" (ngSubmit)="onSubmit()">
      <mat-card-content class="space-y-4">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Student ID</mat-label>
          <input matInput type="number" formControlName="studentId" />
          <mat-error *ngIf="gradeForm.controls.studentId.hasError('required')">
            Student ID is required
          </mat-error>
          <mat-error *ngIf="gradeForm.controls.studentId.hasError('min')">
            Student ID must be greater than zero
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Course ID</mat-label>
          <input matInput type="number" formControlName="courseId" />
          <mat-error *ngIf="gradeForm.controls.courseId.hasError('required')">
            Course ID is required
          </mat-error>
          <mat-error *ngIf="gradeForm.controls.courseId.hasError('min')">
            Course ID must be greater than zero
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Score (0-100)</mat-label>
          <input matInput type="number" formControlName="score" />
          <mat-error *ngIf="gradeForm.controls.score.hasError('required')">
            Score is required
          </mat-error>
          <mat-error *ngIf="gradeForm.controls.score.hasError('min') || gradeForm.controls.score.hasError('max')">
            Score must be between 0 and 100
          </mat-error>
        </mat-form-field>

        <div *ngIf="isSubmitting" class="flex justify-center py-3">
          <mat-spinner diameter="32"></mat-spinner>
        </div>

        <div *ngIf="submissionStatus" class="mt-4 p-3 rounded-lg bg-slate-800 text-sky-400 text-sm font-medium border border-slate-700">
          {{ submissionStatus }}
        </div>
      </mat-card-content>

      <mat-card-actions class="mt-4">
        <button mat-raised-button color="primary" type="submit" [disabled]="gradeForm.invalid || isSubmitting" class="w-full py-3 text-base font-semibold">
          Submit Final Grade
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
